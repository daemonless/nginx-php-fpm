; php-fpm pool. Copied to /config/php/www.conf on first run and loaded from
; there afterwards.
[www]
user = bsd
group = bsd

listen = /var/run/php-fpm/php-fpm.sock
listen.owner = bsd
listen.group = bsd
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Pass the container environment (TZ, PUID, your own variables) to PHP and
; send worker output to the container log.
clear_env = no
catch_workers_output = yes
