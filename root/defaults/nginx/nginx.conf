# Main nginx config. Copied to /config/nginx/nginx.conf on first run and
# loaded from there afterwards, so edits here survive container updates.
user bsd;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 64M;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Get client IP from behind reverse proxy
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Allowed reverse proxy server IP ranges
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from fd00::/8;

    upstream php-handler {
        server unix:/var/run/php-fpm/php-fpm.sock;
    }

    # One file per site; default.conf serves /config/www.
    include /config/nginx/site-confs/*.conf;
}
