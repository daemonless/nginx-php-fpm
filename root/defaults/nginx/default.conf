# Default site: PHP from /config/www. Copied to
# /config/nginx/site-confs/default.conf on first run and never overwritten.
server {
    listen 80 default_server;
    server_name _;

    root /config/www;
    index index.php index.html;

    location /daemonless-ping {
        access_log off;
        return 200 "pong";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php-handler;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
